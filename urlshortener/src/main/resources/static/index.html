
<!DOCTYPE html>
<html>
<head>
    <title>Java URL Shortener</title>

    <style>
        :root {
            --bg-color: #F4F1DE;      
            --card-bg: #FFFFFF;       
            --text-main: #3D405B;    
            --accent-main: #81B29A;   
            --accent-hover: #5F8F78;  
            --accent-warm: #E07A5F;   
            --accent-warm-hover: #C25B42; 
            --shadow: rgba(61, 64, 91, 0.08);
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, Helvetica; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 80px;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
        }

        h1 {
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 30px;
        }

        /*card look*/
        #inputSection, #resultSection {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 10px; /*rounder corners */
            box-shadow: 0 10px 25px var(--shadow); /*"floating" effect */
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        
        /*Input Box*/
        input { 
            padding: 14px; 
            width: 85%; 
            margin-bottom: 20px; 
            border: 2px solid #E0E0E0; 
            border-radius: 10px; 
            font-size: 1rem;
            outline: none;
            transition: border-color 0.4s ease; /*fade when clicking the box */
            color: var(--text-main);
            background-color: #FAFAFA;
        }

        /*typing*/
        input:focus {
            border-color: var(--accent-main); 
        }

        /*Button*/
        button { 
            padding: 14px 24px; 
            cursor: pointer; 
            background: var(--accent-main); 
            color: #FFFFFF; 
            border: none; 
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            transition: background-color 0.3s, transform 0.1s; /*Color change & click effect */
            width: 90%;
        }

        button:hover{
            background: var(--accent-hover);
        }

        button:active{
            transform: scale(0.8); /* pressing inwards*/
        }

        /*result link*/
        #shortLink {
            font-size: 1.25rem;
            color: var(--accent-main);
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
            padding: 10px;
            background: rgba(129, 178, 154, 0.1); /*Light highlight*/
            border-radius: 8px;
        }

        #shortLink:hover { text-decoration: underline; }

        /*reset button*/
        .btn-secondary{
            background: var(--accent-warm);
            margin-top: 20px;
        }

        .btn-secondary:hover{
            background: var(--accent-warm-hover);
        }
        
    </style>
</head>
<body>
    <h1>Mini URL Shortener</h1>
    <div id="inputSection">
        <p>Paste your long link below:</p>
        <input type="text" id="longURL" placeholder = "https://example.com/very-long-URL-link">
        <br>
        <button onclick = "shorten()">Shorten URL!</button>
    </div>

    <div id="resultSection" style = "display: none;">
        <p>
            <span>Your short URL is: </span>
            <a id="shortLink" href="#" target="_blank"></a>
        </p>
        <br>
        <button onclick = "resetUI()" class="btn-secondary">Shorten Another URL!</button>

    </div>

    <script>
        async function shorten(){

            //Grab user input from the input box (ID)
            const urlInput = document.getElementById('longURL').value;

            //Check if valid
            if (!urlInput){
                alert("Please enter a valid URL!");
                return;
            }

            //Fetch -- browser tab that calls to Java @GetMapping("/shorten")
            const response = await fetch('/shorten?url=' + encodeURIComponent(urlInput));

            //Wait for server to send back shorten link
            const text = await response.text();

            //Hyperlink
            const linkElement = document.getElementById('shortLink');
            linkElement.innerText = text;
            linkElement.href = text;

            //Put text into 'result' so user sees it
            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';
        }

        function resetUI(){

            //Clear board & toggles to view back
            document.getElementById('longURL').value = '';
            document.getElementById('inputSection').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
        }
    </script>
</body>
</html>
